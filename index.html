<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Luxury Streetwear Store" />
    <title>Login - Luxury Streetwear Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="container navbar-content">
        <a href="index.html" class="navbar-logo">
          <span class="logo-text">STREETWEAR</span>
          <span class="logo-accent">STORE</span>
        </a>
        <button
          class="navbar-toggle"
          id="navbar-toggle"
          aria-label="Toggle navigation"
        >
          <span class="hamburger"></span>
          <span class="hamburger"></span>
          <span class="hamburger"></span>
        </button>
        <div class="navbar-menu" id="navbar-menu">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link">Shop</a>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link">
                <span>Cart</span>
                <span class="cart-badge" id="cart-count">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="index.html" class="nav-link" id="login-link">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container login-container">
      <div class="forms">
        <form id="loginForm" class="form active" aria-label="Login Form">
          <h2>Login</h2>
          <input
            type="email"
            placeholder="Email"
            required
            autocomplete="email"
            spellcheck="false"
            inputmode="email"
          />
          <input
            type="password"
            placeholder="Password"
            required
            autocomplete="current-password"
            minlength="6"
            maxlength="32"
          />
          <button type="submit" class="btn btn-primary">Login</button>
          <p>
            Don't have an account?
            <button type="button" class="btn-text" id="showRegister">
              Register
            </button>
          </p>
        </form>

        <form id="registerForm" class="form" aria-label="Register Form">
          <h2>Register</h2>
          <input
            type="text"
            placeholder="Name"
            required
            id="reg-name"
            autocomplete="name"
            minlength="3"
            maxlength="40"
            spellcheck="false"
          />
          <input
            type="email"
            placeholder="Email"
            required
            id="reg-email"
            autocomplete="email"
            inputmode="email"
            spellcheck="false"
          />
          <input
            type="password"
            placeholder="Password"
            required
            id="reg-password"
            autocomplete="new-password"
            minlength="6"
            maxlength="32"
          />
          <button type="submit" class="btn btn-primary">Register</button>
          <p>
            Already have an account?
            <button type="button" class="btn-text" id="showLogin">Login</button>
          </p>
        </form>
      </div>
    </main>

    <!-- ملف الجافاسكريبت -->
    <script src="js/script.js" defer></script>
  </body>
</html>
